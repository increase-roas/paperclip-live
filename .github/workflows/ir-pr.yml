# Fork-local pull request gate for increase-roas/paperclip-live.
#
# Upstream's pr.yml reuses paperclipai/paperclip's
# .github/workflows/pr-trusted.yml@master. That workflow targets Paperclip's
# private runner group and depends on their secrets, so it cannot run on this
# fork; ir-guard.yml keeps it switched off on purpose.
#
# This workflow is the fork's PR entry point for repository-owned branches.
# It calls ir-ci.yml on brain-vps. Pull requests get build + typecheck.
# Tests run after merge to master or when a PR receives the full-ci label.
# The repository setting Settings -> Actions ->
# General must also be enabled; a workflow cannot run while Actions is disabled.
name: IR PR

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: read   # upstream-sync dry run lists existing sync PRs

jobs:
  ci:
    name: IR CI
    # Other labels do not start a new run.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    # A new push supersedes the previous run for the same pull request. This
    # sits on the job, so a skipped run for another label cancels nothing.
    concurrency:
      group: ir-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    uses: ./.github/workflows/ir-ci.yml
    with:
      full_suite: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
