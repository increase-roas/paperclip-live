# Builds our Paperclip image (upstream `production` target + live python
# runtime, docker/increase-roas/) and publishes it as a private package:
#   ghcr.io/increase-roas/paperclip:sha-<full sha>   (immutable, use its digest)
#   ghcr.io/increase-roas/paperclip:master           (moving, for reference only)
name: IR image

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "doc/**"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ir-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    # brain-vps has no Docker daemon. This job builds multi-stage images with buildx.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./cli/package.json').version")-ir.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker/increase-roas/docker-bake.hcl
          targets: ir
          push: true
          set: |
            *.cache-from=type=gha,scope=ir-image
            *.cache-to=type=gha,scope=ir-image,mode=min
        env:
          PAPERCLIP_BUILD_COMMIT: ${{ steps.v.outputs.commit }}
          PAPERCLIP_BUILD_VERSION: ${{ steps.v.outputs.version }}
          CLI_TOOLS_CACHE_EPOCH: ${{ steps.v.outputs.epoch }}
          TAGS: ghcr.io/increase-roas/paperclip:sha-${{ steps.v.outputs.commit }},ghcr.io/increase-roas/paperclip:master

      - name: Smoke test and record digest
        run: |
          IMG=ghcr.io/increase-roas/paperclip:sha-${{ steps.v.outputs.commit }}
          docker pull "$IMG"
          DIGEST=$(docker image inspect "$IMG" --format '{{index .RepoDigests 0}}')
          docker run --rm --entrypoint sh "$IMG" -c 'paperclipai --version && python3 --version && pip --version && pnpm --version && gh --version | head -1 && rg --version | head -1 && ls /opt/ms-playwright'
          # Boot on an empty data folder the way doc/DOCKER.md's one-liner does, then wait for /api/health.
          mkdir -p /tmp/pc-data
          docker run -d --name pc -p 3100:3100 -v /tmp/pc-data:/paperclip \
            -e BETTER_AUTH_SECRET="$(openssl rand -hex 32)" \
            -e PAPERCLIP_TOOL_ACTION_SIGNING_SECRET="$(openssl rand -hex 32)" "$IMG" || true
          ok=0; for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3100/api/health; then ok=1; break; fi; sleep 4; done
          docker logs --tail 80 pc || true
          docker rm -f pc >/dev/null || true
          {
            echo "## Image"
            echo ""
            echo "- Tag: \`$IMG\`"
            echo "- Digest (pin this): \`$DIGEST\`"
            echo "- Version: \`${{ steps.v.outputs.version }}\`"
            echo "- Boot smoke (/api/health): $([ $ok = 1 ] && echo passed || echo FAILED)"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$ok" = 1 ]
