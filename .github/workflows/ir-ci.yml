# Increase ROAS CI. Runs Paperclip's own commands from package.json /
# doc/DEVELOPING.md: install, build, typecheck, tests.
# Pull requests run on GitHub-hosted ubuntu-latest so untrusted PR branch code
# does not execute on brain-vps; post-merge master runs use the brain-vps runner.
# (Upstream's pr.yml calls Paperclip's pr-trusted.yml, which needs Paperclip's
# private runner fleet and secrets, so ir-guard keeps it switched off here.
# ir-pr.yml is the fork's PR entry point and calls this workflow.)
name: IR CI

on:
  workflow_call:
    inputs:
      full_suite:
        description: Run the test suites on a pull request (set by the full-ci label).
        type: boolean
        default: false
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ir-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read   # upstream-sync dry run lists existing sync PRs

env:
  CI: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  # Same heap as Paperclip's Dockerfile; one workspace package at a time so the
  # standard runner does not run out of memory compiling the server.
  NODE_OPTIONS: --max-old-space-size=4096
  npm_config_workspace_concurrency: "1"

jobs:
  changes:
    name: detect changed paths
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && '["self-hosted", "brain-vps"]' || '"ubuntu-latest"') }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ir: ${{ steps.filter.outputs.ir }}
      # Pull requests get build + typecheck, plus the IR tests when IR code
      # changed. The full test suites run on master pushes, manual runs, and
      # PRs with the full-ci label.
      full: ${{ github.event_name != 'pull_request' || inputs.full_suite == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Classify the change set
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          else
            files=$(git ls-files)
          fi
          printf 'changed files (first 20):\n%s\n' "$(printf '%s\n' "$files" | head -20)"
          code=false
          # Docs, plans, logs and announcements do not need the build or the
          # suites. Anything else (code, workflows, configs, lockfile) does.
          if printf '%s\n' "$files" | grep -vE '^(doc|docs|logs|announcements)/' | grep -vE '\.(md|mdx|txt)$' | grep -q .; then
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          ir=false
          if printf '%s\n' "$files" | grep -qE '^(server|ui)/src/ir/'; then
            ir=true
          fi
          echo "ir=$ir" >> "$GITHUB_OUTPUT"

  build:
    name: build + typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && '["self-hosted", "brain-vps"]' || '"ubuntu-latest"') }}
    # Passing runs take about 30 minutes (p90 32.5, max 37.7 in Nov 2026).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ir-setup
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck

  test:
    # GitHub expressions have no arithmetic operators, so each leg names its
    # 1-based shard in `label`. `matrix.shard_index + 1` made this workflow
    # invalid and every run failed before a job could start.
    name: test (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && '["self-hosted", "brain-vps"]' || '"ubuntu-latest"') }}
    # Passing serialized shards take 10 to 13 minutes. The old single general
    # job hit the 90 minute limit 76 of 92 times in Nov 2026 and never passed,
    # so a hang now costs 20 to 40 minutes, not 90. A leg can set its own
    # `timeout` in the matrix (the native-runner leg compiles Rust first).
    timeout-minutes: ${{ matrix.timeout || (matrix.mode == 'general' && 40 || 20) }}
    env:
      # Keep the general-server shard worker count stable across hosts.
      PAPERCLIP_GENERAL_SERVER_SHARD_WORKERS: "1"
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          # The serialized shard needs more than two hours on an eight-core host,
          # so it is split into six jobs here. Same flags as pr-trusted.yml.
          - { mode: serialized, label: serialized 1/6, shard_index: 0, shard_count: 6 }
          - { mode: serialized, label: serialized 2/6, shard_index: 1, shard_count: 6 }
          - { mode: serialized, label: serialized 3/6, shard_index: 2, shard_count: 6 }
          - { mode: serialized, label: serialized 4/6, shard_index: 3, shard_count: 6 }
          - { mode: serialized, label: serialized 5/6, shard_index: 4, shard_count: 6 }
          - { mode: serialized, label: serialized 6/6, shard_index: 5, shard_count: 6 }
          # One unsharded general job ran past the 90-minute cap (about 25 min
          # of chat, then 60+ min of server suites). These groups cover the same
          # suites: chat, server without chat, and the native-runner suites.
          - { mode: general, label: general server 1/10, group: general-server-without-chat-or-native-runner, shard_index: 0, shard_count: 10 }
          - { mode: general, label: general server 2/10, group: general-server-without-chat-or-native-runner, shard_index: 1, shard_count: 10 }
          - { mode: general, label: general server 3/10, group: general-server-without-chat-or-native-runner, shard_index: 2, shard_count: 10 }
          - { mode: general, label: general server 4/10, group: general-server-without-chat-or-native-runner, shard_index: 3, shard_count: 10 }
          - { mode: general, label: general server 5/10, group: general-server-without-chat-or-native-runner, shard_index: 4, shard_count: 10 }
          - { mode: general, label: general server 6/10, group: general-server-without-chat-or-native-runner, shard_index: 5, shard_count: 10 }
          - { mode: general, label: general server 7/10, group: general-server-without-chat-or-native-runner, shard_index: 6, shard_count: 10 }
          - { mode: general, label: general server 8/10, group: general-server-without-chat-or-native-runner, shard_index: 7, shard_count: 10 }
          - { mode: general, label: general server 9/10, group: general-server-without-chat-or-native-runner, shard_index: 8, shard_count: 10 }
          - { mode: general, label: general server 10/10, group: general-server-without-chat-or-native-runner, shard_index: 9, shard_count: 10 }
          - { mode: general, label: general native runner, group: general-server-native-runner, prebuild_runner: true, timeout: 60 }
          - { mode: general, label: general chat 1/3, group: general-chat, shard_index: 0, shard_count: 3, serial_chat: true }
          - { mode: general, label: general chat 2/3, group: general-chat, shard_index: 1, shard_count: 3, serial_chat: true }
          - { mode: general, label: general chat 3/3, group: general-chat, shard_index: 2, shard_count: 3, serial_chat: true }
          - { mode: general, label: general workspaces-a, group: general-workspaces-a }
          - { mode: general, label: general workspaces-b, group: general-workspaces-b }
          - { mode: general, label: general workspaces-c, group: general-workspaces-c }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ir-setup
      # The native-runner suites each build these in a beforeAll with a 300-600s
      # limit; a cold release compile on this runner is longer. Build once here,
      # as release-verify.yml does, so each suite's cargo call is a freshness check.
      - name: Build the Runner binaries the native-runner suites use
        if: matrix.prebuild_runner
        working-directory: packages/paperclip-runner
        run: |
          set -euo pipefail
          node scripts/build-verified-provider-entrypoints.mjs
          pnpm build:rust
          cargo build --release --manifest-path runner/Cargo.toml --locked -p paperclip-runner-core --bin paperclip-runnerd --bin fake-codex-app-server
          cargo build --release --manifest-path runner/Cargo.toml --locked -p paperclip-runner-core --example recovery-fixture
      - name: Test
        run: |
          if [ "${{ matrix.mode }}" = "serialized" ]; then
            pnpm test:run:serialized -- --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}
          else
            set -- --group "${{ matrix.group }}"
            if [ -n "${{ matrix.shard_count }}" ]; then
              set -- "$@" --shard-index "${{ matrix.shard_index }}" --shard-count "${{ matrix.shard_count }}"
            fi
            if [ "${{ matrix.serial_chat }}" = "true" ]; then set -- "$@" --serial-chat; fi
            pnpm test:run:general -- "$@"
          fi

  # The IR suites take under a minute, so pull requests that touch IR code
  # run them even without the full-ci label (the full suite covers them).
  ir-tests:
    name: IR tests
    needs: changes
    if: needs.changes.outputs.ir == 'true' && needs.changes.outputs.full != 'true'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && '["self-hosted", "brain-vps"]' || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ir-setup
      - name: Server IR tests
        working-directory: server
        run: pnpm exec vitest run src/ir
      - name: UI IR tests
        working-directory: ui
        run: pnpm exec vitest run src/ir

  ir-scripts:
    name: IR files
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && '["self-hosted", "brain-vps"]' || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell and workflow lint
        run: |
          tools_dir="$(mktemp -d "$RUNNER_TEMP/ir-lint.XXXXXX")"
          trap 'rm -rf "$tools_dir"' EXIT
          if ! command -v shellcheck >/dev/null; then
            archive="$tools_dir/shellcheck.tar.xz"
            curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz -o "$archive"
            printf '%s  %s\n' '6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87' "$archive" | sha256sum -c -
            tar -xJf "$archive" -C "$tools_dir" --strip-components=1 shellcheck-v0.10.0/shellcheck
            export PATH="$tools_dir:$PATH"
          fi
          shellcheck scripts/ir/*.sh docker/increase-roas/*.sh
          python3 -m pip install --quiet --target "$tools_dir" yamllint
          PYTHONPATH="$tools_dir" python3 -m yamllint -d '{extends: relaxed, rules: {line-length: disable}}' .github/workflows/ir-*.yml .github/actions/ir-setup/action.yml
      - name: IR metric guard (no inline metric formulas or hardcoded GHL/Meta IDs)
        run: |
          node --test scripts/ir/check-ir-metrics.test.mjs
          node scripts/ir/check-ir-metrics.mjs
      - name: Upstream sync dry run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: "1"
        run: |
          git fetch --quiet origin master
          bash scripts/ir/upstream-sync.sh

  ci-passed:
    name: IR CI passed
    if: always()
    needs: [changes, build, test, ir-tests, ir-scripts]
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && '["self-hosted", "brain-vps"]' || '"ubuntu-latest"') }}
    steps:
      - name: Aggregate the required jobs
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ needs.changes.result }}" = "success" ]
          [ "${{ needs.ir-scripts.result }}" = "success" ]
          if [ "${{ needs.changes.outputs.ir }}" = "true" ] && [ "${{ needs.changes.outputs.full }}" != "true" ]; then
            [ "${{ needs.ir-tests.result }}" = "success" ]
          else
            [ "${{ needs.ir-tests.result }}" = "skipped" ]
          fi
          if [ "${{ needs.changes.outputs.code }}" = "true" ]; then
            [ "${{ needs.build.result }}" = "success" ]
            if [ "${{ needs.changes.outputs.full }}" = "true" ]; then
              [ "${{ needs.test.result }}" = "success" ]
            else
              echo "pull request without full-ci label: test suites run after merge"
              [ "${{ needs.test.result }}" = "skipped" ]
            fi
          else
            echo "docs-only change: build and test were skipped"
            [ "${{ needs.build.result }}" = "skipped" ]
            [ "${{ needs.test.result }}" = "skipped" ]
          fi
