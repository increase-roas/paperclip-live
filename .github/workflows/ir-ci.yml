# Increase ROAS CI. Runs on the self-hosted runner on the Paperclip VPS by
# default (GitHub-hosted minutes are disabled by the org budget). To go back to
# GitHub-hosted runners, set the repo variable IR_RUNS_ON to the JSON string
# "ubuntu-latest" (keep the double quotes; the value goes through fromJSON).
# Runs Paperclip's own commands
# from package.json / doc/DEVELOPING.md: install, build, typecheck, tests.
# (Upstream's pr.yml calls Paperclip's pr-trusted.yml, which needs Paperclip's
# private runner fleet and secrets, so ir-guard keeps it switched off here.
# ir-pr.yml is the fork's PR entry point and calls this workflow.)
name: IR CI

on:
  workflow_call:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ir-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read   # upstream-sync dry run lists existing sync PRs

env:
  CI: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  # Same heap as Paperclip's Dockerfile; one workspace package at a time so the
  # standard runner does not run out of memory compiling the server.
  NODE_OPTIONS: --max-old-space-size=4096
  npm_config_workspace_concurrency: "1"

jobs:
  changes:
    name: detect changed paths
    runs-on: ${{ fromJSON(vars.IR_RUNS_ON || '["self-hosted","paperclip-vps"]') }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Classify the change set
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          else
            files=$(git ls-files)
          fi
          printf 'changed files (first 20):\n%s\n' "$(printf '%s\n' "$files" | head -20)"
          code=false
          # Docs, plans, logs and announcements do not need the build or the
          # suites. Anything else (code, workflows, configs, lockfile) does.
          if printf '%s\n' "$files" | grep -vE '^(doc|docs|logs|announcements)/' | grep -vE '\.(md|mdx|txt)$' | grep -q .; then
            code=true
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build:
    name: build + typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.IR_RUNS_ON || '["self-hosted","paperclip-vps"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ir-setup
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck

  test:
    # GitHub expressions have no arithmetic operators, so the 1-based shard
    # number is a matrix field. `matrix.shard_index + 1` made this workflow
    # invalid and every run failed before a job could start.
    name: test (${{ matrix.mode }}${{ matrix.mode == 'serialized' && format(' {0}/{1}', matrix.shard_number, matrix.shard_count) || '' }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(vars.IR_RUNS_ON || '["self-hosted","paperclip-vps"]') }}
    # Six serialized shards plus one general job; 120 minutes was the single-job
    # ceiling before sharding.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # One VPS runner serves this repo; do not queue more than two shards at once.
      max-parallel: 2
      matrix:
        include:
          - mode: general
            shard_index: 0
            shard_count: 1
          # The serialized shard needs more than two hours on an eight-core host,
          # so it runs as six parallel jobs here. Same flags as pr-trusted.yml.
          - { mode: serialized, shard_index: 0, shard_number: 1, shard_count: 6 }
          - { mode: serialized, shard_index: 1, shard_number: 2, shard_count: 6 }
          - { mode: serialized, shard_index: 2, shard_number: 3, shard_count: 6 }
          - { mode: serialized, shard_index: 3, shard_number: 4, shard_count: 6 }
          - { mode: serialized, shard_index: 4, shard_number: 5, shard_count: 6 }
          - { mode: serialized, shard_index: 5, shard_number: 6, shard_count: 6 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ir-setup
      - name: Test
        run: |
          if [ "${{ matrix.mode }}" = "serialized" ]; then
            pnpm test:run:serialized -- --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}
          else
            pnpm test:run:general
          fi

  ir-scripts:
    name: IR files
    runs-on: ${{ fromJSON(vars.IR_RUNS_ON || '["self-hosted","paperclip-vps"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell and workflow lint
        run: |
          shellcheck scripts/ir/*.sh docker/increase-roas/*.sh
          command -v yamllint >/dev/null || pip install --quiet yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' .github/workflows/ir-*.yml .github/actions/ir-setup/action.yml
      - name: Upstream sync dry run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: "1"
        run: |
          git fetch --quiet origin master
          bash scripts/ir/upstream-sync.sh

  ci-passed:
    name: IR CI passed
    if: always()
    needs: [changes, build, test, ir-scripts]
    runs-on: ${{ fromJSON(vars.IR_RUNS_ON || '["self-hosted","paperclip-vps"]') }}
    steps:
      - name: Aggregate the required jobs
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ needs.changes.result }}" = "success" ]
          [ "${{ needs.ir-scripts.result }}" = "success" ]
          if [ "${{ needs.changes.outputs.code }}" = "true" ]; then
            [ "${{ needs.build.result }}" = "success" ]
            [ "${{ needs.test.result }}" = "success" ]
          else
            echo "docs-only change: build and test were skipped"
            [ "${{ needs.build.result }}" = "skipped" ]
            [ "${{ needs.test.result }}" = "skipped" ]
          fi
