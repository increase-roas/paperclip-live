# Increase ROAS CI on GitHub-hosted runners. Runs Paperclip's own commands
# from package.json / doc/DEVELOPING.md: install, build, typecheck, tests.
# (Upstream's pr.yml calls Paperclip's pr-trusted.yml, which needs Paperclip's
# private runner fleet and secrets, so ir-guard keeps it switched off here.
# ir-pr.yml is the fork's PR entry point and calls this workflow.)
name: IR CI

on:
  workflow_call:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ir-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read   # upstream-sync dry run lists existing sync PRs

env:
  CI: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  # Same heap as Paperclip's Dockerfile; one workspace package at a time so the
  # standard runner does not run out of memory compiling the server.
  NODE_OPTIONS: --max-old-space-size=4096
  npm_config_workspace_concurrency: "1"

jobs:
  build:
    name: build + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ir-setup
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck

  test:
    name: test (${{ matrix.mode }}${{ matrix.mode == 'serialized' && format(' {0}/{1}', matrix.shard_index + 1, matrix.shard_count) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: general
            shard_index: 0
            shard_count: 1
          # The serialized shard needs more than two hours on an eight-core host,
          # so it runs as six parallel jobs here. Same flags as pr-trusted.yml.
          - { mode: serialized, shard_index: 0, shard_count: 6 }
          - { mode: serialized, shard_index: 1, shard_count: 6 }
          - { mode: serialized, shard_index: 2, shard_count: 6 }
          - { mode: serialized, shard_index: 3, shard_count: 6 }
          - { mode: serialized, shard_index: 4, shard_count: 6 }
          - { mode: serialized, shard_index: 5, shard_count: 6 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ir-setup
      - name: Test
        run: |
          if [ "${{ matrix.mode }}" = "serialized" ]; then
            pnpm test:run:serialized -- --shard-index ${{ matrix.shard_index }} --shard-count ${{ matrix.shard_count }}
          else
            pnpm test:run:general
          fi

  ir-scripts:
    name: IR files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell and workflow lint
        run: |
          shellcheck scripts/ir/*.sh docker/increase-roas/*.sh
          pip install --quiet yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' .github/workflows/ir-*.yml .github/actions/ir-setup/action.yml
      - name: Upstream sync dry run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: "1"
        run: |
          git fetch --quiet origin master
          bash scripts/ir/upstream-sync.sh

  ci-passed:
    name: IR CI passed
    if: always()
    needs: [build, test, ir-scripts]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.build.result }}" = success ] && [ "${{ needs.test.result }}" = success ] && [ "${{ needs.ir-scripts.result }}" = success ]
