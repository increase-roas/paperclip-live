# Label definitions for issue triage.
# Source of truth for doc/ISSUE-LABELS.md. Apply with the GitHub label API or
# `gh label create`; repository settings are owned by maintainers.
- name: "priority:p0"
  color: "b60205"
  description: "Production outage, data loss, or security incident"
- name: "priority:p1"
  color: "d93f0b"
  description: "Blocks a release or a large share of users"
- name: "priority:p2"
  color: "fbca04"
  description: "Important but has a workaround"
- name: "priority:p3"
  color: "0e8a16"
  description: "Nice to have; schedule when capacity allows"
- name: "type:bug"
  color: "d73a4a"
  description: "Something is not working"
- name: "type:feature"
  color: "a2eeef"
  description: "New capability or behavior"
- name: "type:chore"
  color: "cfd3d7"
  description: "Maintenance with no user-visible behavior change"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type:security"
  color: "8b0000"
  description: "Security hardening or vulnerability response"
- name: "type:performance"
  color: "5319e7"
  description: "Latency, throughput, memory, or cost"
- name: "type:test"
  color: "c2e0c6"
  description: "Test coverage or test infrastructure"
- name: "type:dependencies"
  color: "0366d6"
  description: "Dependency update"
- name: "area:server"
  color: "1d76db"
  description: "API and orchestration server"
- name: "area:ui"
  color: "5319e7"
  description: "Board UI"
- name: "area:cli"
  color: "0e8a16"
  description: "paperclipai CLI"
- name: "area:runner"
  color: "d4c5f9"
  description: "Native Runner and provider adapters"
- name: "area:connectors"
  color: "bfd4f2"
  description: "Apps, connections, and MCP surfaces"
- name: "area:skills"
  color: "fef2c0"
  description: "Skills catalog and runtime skills"
- name: "area:release"
  color: "1D76DB"
  description: "Release, packaging, and publishing"
- name: "area:docs"
  color: "0075ca"
  description: "Documentation and guides"
- name: "area:infra"
  color: "555555"
  description: "CI, containers, and host infrastructure"
