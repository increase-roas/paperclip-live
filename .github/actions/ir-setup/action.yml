name: IR setup
description: Node 24 + pnpm (packageManager) + pinned Rust toolchain + pnpm install, per doc/DEVELOPING.md
runs:
  using: composite
  steps:
    - name: Free runner disk (Rust target + node_modules need ~30 GB)
      if: runner.environment == 'github-hosted'
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
        df -h /
    - name: Add 8 GB swap (standard runners have little RAM for the server build)
      if: runner.environment == 'github-hosted'
      shell: bash
      run: |
        sudo swapoff -a || true
        sudo fallocate -l 8G /mnt/ir-swap && sudo chmod 600 /mnt/ir-swap
        sudo mkswap /mnt/ir-swap >/dev/null && sudo swapon /mnt/ir-swap
        free -h
    - uses: actions/setup-node@v4
      with:
        node-version: "24"
    - name: Enable pnpm from packageManager
      shell: bash
      run: corepack enable && pnpm --version
    - name: Ensure rustup is available on self-hosted runners
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto =https --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
        fi
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Rust toolchain from packages/paperclip-runner/rust-toolchain.toml
      shell: bash
      run: cd packages/paperclip-runner && rustup show active-toolchain || rustup toolchain install
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/paperclip-runner/runner
    - name: pnpm store path
      id: store
      shell: bash
      run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ${{ steps.store.outputs.dir }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-
    - name: Cache Vite's dependency pre-bundle
      uses: actions/cache@v4
      with:
        path: node_modules/.vite
        key: vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          vite-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          vite-${{ runner.os }}-
    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
