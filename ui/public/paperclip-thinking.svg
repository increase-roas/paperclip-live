<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 100 100" fill="none">
  <style>
    @keyframes tilePulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @keyframes accentPulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    .t { fill: #f5f3f4; animation: tilePulse 1.2s ease-in-out infinite; }
    .a { fill: #b5db24; animation: accentPulse 1.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .t, .a { animation: none; opacity: 1; }
    }
  </style>
  <rect class="t" style="animation-delay:0ms" x="9.0" y="23.2" width="21.0" height="21.0"/>
  <rect class="t" style="animation-delay:90ms" x="33.9" y="23.2" width="21.0" height="21.0"/>
