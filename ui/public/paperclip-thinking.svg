  <rect class="t" style="animation-delay:270ms" x="33.9" y="48.1" width="21.0" height="21.0"/>
  <rect class="t" style="animation-delay:360ms" x="58.8" y="48.1" width="21.0" height="21.0"/>
  <rect class="t" style="animation-delay:450ms" x="9.0" y="73.0" width="21.0" height="21.0"/>
  <rect class="t" style="animation-delay:540ms" x="33.9" y="73.0" width="21.0" height="21.0"/>
  <rect class="t" style="animation-delay:630ms" x="58.8" y="73.0" width="21.0" height="21.0"/>
