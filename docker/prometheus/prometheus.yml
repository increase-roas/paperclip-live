global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: paperclip-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3100"]

  - job_name: google-sheets
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8849"]

  # Textfile collector for components without their own Prometheus endpoint.
  # Run `pnpm health:export -- --output /var/lib/node_exporter/textfile/paperclip.prom`
  # on a timer; node_exporter exposes the paperclip_component_* series.
  - job_name: node-exporter
    static_configs:
      - targets: ["host.docker.internal:9100"]
