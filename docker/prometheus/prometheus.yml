global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: paperclip-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3100"]

  - job_name: google-sheets
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8849"]
